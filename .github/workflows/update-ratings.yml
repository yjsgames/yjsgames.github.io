# 매주 스토어 평점을 모아 data/ratings.json 을 갱신한다.
# 평점이 기준(data/ratings-config.json 의 recommend) 이상이면 홈페이지 카드에 "추천" 배지가 붙는다.
name: Update store ratings

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test rating rules
        run: node --test tools/update-ratings.test.mjs

      - name: Fetch ratings
        run: node tools/update-ratings.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/ratings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings.json
          git commit -m "chore: 스토어 평점 주간 갱신"
          # 실행 중 main 에 다른 커밋이 들어오면 push 가 거절되므로 한 번 rebase 후 재시도한다
          git push || { git pull --rebase origin main && git push; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 으로 한 push 는 다른 워크플로를 깨우지 않으므로 Pages 빌드를 직접 요청한다.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
